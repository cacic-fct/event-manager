name: event-manager

services:
  events-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=3GB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_buffers=16MB
      - -c
      - default_statistics_target=100
      - -c
      - random_page_cost=4
      - -c
      - effective_io_concurrency=2
      - -c
      - work_mem=5041kB
      - -c
      - huge_pages=off
      - -c
      - jit=off
      - -c
      - wal_compression=lz4
      - -c
      - min_wal_size=1GB
      - -c
      - max_wal_size=4GB
    volumes:
      - /home/shared/docker-data/cacic-event-manager/db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - default

  events-redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    volumes:
      - /home/shared/docker-data/cacic-event-manager/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - default

  events-backend:
    image: ghcr.io/cacic-fct/event-manager/backend:${IMAGE_TAG:-latest}
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@events-db:5432/postgres}
      REDIS_URL: ${REDIS_URL:-redis://events-redis:6379}
      KEYCLOAK_REALM_URL: ${KEYCLOAK_REALM_URL:-}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}
      KEYCLOAK_REDIRECT_URI: ${KEYCLOAK_REDIRECT_URI:-}
      KEYCLOAK_POST_LOGIN_REDIRECT_URI: ${KEYCLOAK_POST_LOGIN_REDIRECT_URI:-}
      KEYCLOAK_POST_LOGOUT_REDIRECT_URI: ${KEYCLOAK_POST_LOGOUT_REDIRECT_URI:-}
      KEYCLOAK_M2M_CLIENT_ID: ${KEYCLOAK_M2M_CLIENT_ID:-}
      KEYCLOAK_M2M_CLIENT_SECRET: ${KEYCLOAK_M2M_CLIENT_SECRET:-}
      KEYCLOAK_M2M_REQUIRE_SERVICE_ACCOUNT: ${KEYCLOAK_M2M_REQUIRE_SERVICE_ACCOUNT:-true}
      KEYCLOAK_M2M_AUDIENCE: ${KEYCLOAK_M2M_AUDIENCE:-}
      KEYCLOAK_M2M_ALLOWED_CLIENTS: ${KEYCLOAK_M2M_ALLOWED_CLIENTS:-}
      TYPESENSE_ENABLED: ${TYPESENSE_ENABLED:-false}
      TYPESENSE_HOST: ${TYPESENSE_HOST:-}
      TYPESENSE_PORT: ${TYPESENSE_PORT:-}
      TYPESENSE_PROTOCOL: ${TYPESENSE_PROTOCOL:-}
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-}
      ACCOUNT_MANAGER_GRPC_URL: ${ACCOUNT_MANAGER_GRPC_URL:-cacic-account-manager-backend:50051}
      ACCOUNT_MANAGER_M2M_AUDIENCE: ${ACCOUNT_MANAGER_M2M_AUDIENCE:-}
      ACCOUNT_MANAGER_M2M_CLIENT_ID: ${ACCOUNT_MANAGER_M2M_CLIENT_ID:-}
      ACCOUNT_MANAGER_M2M_CLIENT_SECRET: ${ACCOUNT_MANAGER_M2M_CLIENT_SECRET:-}
      ACCOUNT_MANAGER_M2M_SCOPE: ${ACCOUNT_MANAGER_M2M_SCOPE:-}
      CALENDAR_FEED_KEY_PEPPER: ${CALENDAR_FEED_KEY_PEPPER:-}
      NOVU_API_URL: ${NOVU_API_URL:-}
      NOVU_SECRET_KEY: ${NOVU_SECRET_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      TURNSTILE_EXPECTED_HOSTNAMES: ${TURNSTILE_EXPECTED_HOSTNAMES:-}
      TURNSTILE_SITEVERIFY_TIMEOUT_MS: ${TURNSTILE_SITEVERIFY_TIMEOUT_MS:-}
    command:
      - sh
      - -c
      - |
        cd /app/apps/backend
        ../../node_modules/.bin/prisma migrate deploy --config prisma.config.ts
        cd /app
        exec node main.js
    depends_on:
      events-db:
        condition: service_healthy
      events-redis:
        condition: service_healthy
    restart: unless-stopped
    labels:
      - "wud.watch=true"
      - "wud.watch.digest=true"
      - "wud.tag.include=^latest$$"
      - "wud.trigger.include=docker.eventmanager"
      - "wud.display.name=event-manager-backend"
      - "wud.link.template=https://github.com/cacic-fct/event-manager/pkgs/container/event-manager%2Fbackend"
      - "traefik.enable=true"
      - "traefik.scope=public"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.event-manager-api.entrypoints=web,websecure"
      - "traefik.http.routers.event-manager-api.rule=Host(`eventos.cacic.com.br`) && PathPrefix(`/api`)"
      - "traefik.http.routers.event-manager-api.tls=true"
      - "traefik.http.routers.event-manager-api.service=event-manager-api-svc"
      - "traefik.http.services.event-manager-api-svc.loadbalancer.server.port=3000"
    networks:
      - default
      - traefik
      - cacic-m2m-event-account
      - cacic-m2m-event-voto

  admin:
    image: ghcr.io/cacic-fct/event-manager/admin:${IMAGE_TAG:-latest}
    environment:
      NODE_ENV: production
      PORT: 4000
    depends_on:
      events-backend:
        condition: service_started
    restart: unless-stopped
    labels:
      - "wud.watch=true"
      - "wud.watch.digest=true"
      - "wud.tag.include=^latest$$"
      - "wud.trigger.include=docker.eventmanager"
      - "wud.display.name=event-manager-admin"
      - "wud.link.template=https://github.com/cacic-fct/event-manager/pkgs/container/event-manager%2Fadmin"
      - "traefik.enable=true"
      - "traefik.scope=public"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.event-manager-admin.entrypoints=web,websecure"
      - "traefik.http.routers.event-manager-admin.rule=Host(`eventos.cacic.com.br`) && PathPrefix(`/admin/`)"
      - "traefik.http.routers.event-manager-admin.tls=true"
      - "traefik.http.routers.event-manager-admin.middlewares=event-manager-admin-frontend-security@file"
      - "traefik.http.routers.event-manager-admin.service=event-manager-admin-svc"
      - "traefik.http.services.event-manager-admin-svc.loadbalancer.server.port=4000"

      - "traefik.http.routers.event-manager-admin-noslash.entrypoints=web,websecure"
      - "traefik.http.routers.event-manager-admin-noslash.rule=Host(`eventos.cacic.com.br`) && Path(`/admin`)"
      - "traefik.http.routers.event-manager-admin-noslash.tls=true"
      - "traefik.http.routers.event-manager-admin-noslash.middlewares=event-manager-admin-slash"
      - "traefik.http.middlewares.event-manager-admin-slash.redirectregex.regex=^https?://([^/]+)/admin$$"
      - "traefik.http.middlewares.event-manager-admin-slash.redirectregex.replacement=https://$${1}/admin/"
      - "traefik.http.middlewares.event-manager-admin-slash.redirectregex.permanent=true"
    networks:
      - default
      - traefik

  public:
    image: ghcr.io/cacic-fct/event-manager/public:${IMAGE_TAG:-latest}
    environment:
      NODE_ENV: production
      PORT: 4000
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      SITEMAP_API_URL: ${SITEMAP_API_URL:-http://events-backend:3000/api/graphql}
    depends_on:
      events-backend:
        condition: service_started
    restart: unless-stopped
    labels:
      - "wud.watch=true"
      - "wud.watch.digest=true"
      - "wud.tag.include=^latest$$"
      - "wud.trigger.include=docker.eventmanager"
      - "wud.display.name=event-manager-public"
      - "wud.link.template=https://github.com/cacic-fct/event-manager/pkgs/container/event-manager%2Fpublic"
      - "traefik.enable=true"
      - "traefik.scope=public"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.event-manager-public.entrypoints=web,websecure"
      - "traefik.http.routers.event-manager-public.rule=Host(`eventos.cacic.com.br`) && PathPrefix(`/app/`)"
      - "traefik.http.routers.event-manager-public.tls=true"
      - "traefik.http.routers.event-manager-public.middlewares=event-manager-public-frontend-security@file"
      - "traefik.http.routers.event-manager-public.service=event-manager-public-svc"
      - "traefik.http.services.event-manager-public-svc.loadbalancer.server.port=4000"

      - "traefik.http.routers.event-manager-root.entrypoints=web,websecure"
      - "traefik.http.routers.event-manager-root.rule=Host(`eventos.cacic.com.br`) && Path(`/`)"
      - "traefik.http.routers.event-manager-root.tls=true"
      - "traefik.http.routers.event-manager-root.middlewares=event-manager-root-redirect"
      - "traefik.http.middlewares.event-manager-root-redirect.redirectregex.regex=^https?://([^/]+)/$$"
      - "traefik.http.middlewares.event-manager-root-redirect.redirectregex.replacement=https://$${1}/app/"
      - "traefik.http.middlewares.event-manager-root-redirect.redirectregex.permanent=true"

      - "traefik.http.routers.event-manager-public-noslash.entrypoints=web,websecure"
      - "traefik.http.routers.event-manager-public-noslash.rule=Host(`eventos.cacic.com.br`) && Path(`/app`)"
      - "traefik.http.routers.event-manager-public-noslash.tls=true"
      - "traefik.http.routers.event-manager-public-noslash.middlewares=event-manager-public-slash"
      - "traefik.http.middlewares.event-manager-public-slash.redirectregex.regex=^https?://([^/]+)/app$$"
      - "traefik.http.middlewares.event-manager-public-slash.redirectregex.replacement=https://$${1}/app/"
      - "traefik.http.middlewares.event-manager-public-slash.redirectregex.permanent=true"

      - "traefik.http.routers.event-manager-public-textfiles.entrypoints=web,websecure"
      - "traefik.http.routers.event-manager-public-textfiles.rule=Host(`eventos.cacic.com.br`) && (Path(`/robots.txt`) || Path(`/humans.txt`) || Path(`/.well-known/security.txt`))"
      - "traefik.http.routers.event-manager-public-textfiles.tls=true"
      - "traefik.http.routers.event-manager-public-textfiles.middlewares=event-manager-public-textfiles-redirect"
      - "traefik.http.middlewares.event-manager-public-textfiles-redirect.redirectregex.regex=^https?://([^/]+)(/.*)$$"
      - "traefik.http.middlewares.event-manager-public-textfiles-redirect.redirectregex.replacement=https://$${1}/app$${2}"
      - "traefik.http.middlewares.event-manager-public-textfiles-redirect.redirectregex.permanent=true"

      - "traefik.http.routers.event-manager-validar.entrypoints=web,websecure"
      - "traefik.http.routers.event-manager-validar.rule=Host(`eventos.cacic.com.br`) && PathPrefix(`/validar/`)"
      - "traefik.http.routers.event-manager-validar.tls=true"
      - "traefik.http.routers.event-manager-validar.middlewares=event-manager-validar-redirect"
      - "traefik.http.middlewares.event-manager-validar-redirect.redirectregex.regex=^https?://([^/]+)/validar/(.*)$$"
      - "traefik.http.middlewares.event-manager-validar-redirect.redirectregex.replacement=https://$${1}/app/validate/$${2}"
      - "traefik.http.middlewares.event-manager-validar-redirect.redirectregex.permanent=false"
      - "traefik.http.routers.event-manager-validar.service=event-manager-public-svc"

      - "traefik.http.routers.event-manager-fctapp.entrypoints=web,websecure"
      - "traefik.http.routers.event-manager-fctapp.rule=Host(`fctapp.cacic.com.br`)"
      - "traefik.http.routers.event-manager-fctapp.tls=true"
      - "traefik.http.routers.event-manager-fctapp.middlewares=event-manager-fctapp-redirect"
      - 'traefik.http.middlewares.event-manager-fctapp-redirect.redirectregex.regex=^https?://fctapp\.cacic\.dev\.br/.*$$'
      - "traefik.http.middlewares.event-manager-fctapp-redirect.redirectregex.replacement=https://eventos.cacic.com.br/app/"
      - "traefik.http.middlewares.event-manager-fctapp-redirect.redirectregex.permanent=true"
    networks:
      - default
      - traefik

networks:
  cacic-m2m-event-account:
    external: true
  cacic-m2m-event-voto:
    external: true
  traefik:
    external: true
  default:

name: Build and Publish Storybook to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Storybook
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Build standalone Storybooks
        run: bunx nx run-many --target=build-storybook --projects=admin,public --configuration=ci --parallel=2

      - name: Prepare GitHub Pages artifact
        shell: bash
        run: |
          rm -rf dist/storybook-pages
          mkdir -p dist/storybook-pages/admin dist/storybook-pages/public

          cp -R dist/storybook/admin/. dist/storybook-pages/admin/
          cp -R dist/storybook/public/. dist/storybook-pages/public/

          touch dist/storybook-pages/.nojekyll

      - name: Build composed Storybook
        run: bunx nx build-storybook admin --configuration=ci --skip-nx-cache
        env:
          STORYBOOK_PUBLISH_COMPOSITION: 'true'

      - name: Add composed Storybook to Pages root
        run: cp -R dist/storybook/admin/. dist/storybook-pages/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/storybook-pages

  deploy:
    name: Deploy Storybook
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - id: deploy
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5

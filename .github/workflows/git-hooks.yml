name: Git hook formatting

on:
  pull_request:
    paths:
      - '.husky/**'
      - '.gitattributes'
      - '.prettier*'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/git-hooks.yml'
  push:
    paths:
      - '.husky/**'
      - '.gitattributes'
      - '.prettier*'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/git-hooks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formatting:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: node .husky/verify.mjs

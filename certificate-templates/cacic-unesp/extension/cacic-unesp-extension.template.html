<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Certificate Template - CACiC Unesp</title>

  </head>
  <body>
    <section class="certificate-page page-1">
      <div class="hero">
        <p class="date">{{issue_day}} de {{issue_month}} de {{issue_year}}</p>
        <p class="top-text">{{top-text}}</p>
        <p class="participant-name">{{name}}</p>
        <p class="bottom-text">{{bottom-text}}</p>
        <p class="event-name">{{major_event_or_event_name}}</p>
        <p class="additional-text">{{additional_text}}</p>
      </div>

      <div class="verification-block">
        <a class="verification-link" href="{{verificationUrl}}">{{verificationUrlText}}</a>
        <img src="{{verificationQrCodeDataUrl}}" alt="QR Code de verificação" class="verification-qr-code" />
      </div>
    </section>

    <section class="certificate-page page-2">
      <div class="verification-block-2">
        <img src="{{verificationQrCodeDataUrl}}" alt="QR Code de verificação" class="verification-qr-code" />
      </div>
      <div class="certificate-content">
        <p class="participant-name-inline">{{name}}</p>
        <p class="participant-document-inline">Documento: {{identityDocument}}</p>
        <p class="event-name-inline">{{majorEvent or event name}}</p>
        <p class="certificate-type-inline">{{certificateType}}</p>
        <p class="section-block">{{second_page_content}}</p>
      </div>
    </section>
  </body>
</html>

<section class="section attendance-shell">
  <mat-tab-group
    animationDuration="160ms"
    mat-stretch-tabs="false"
    [selectedIndex]="selectedTabIndex()"
    (selectedIndexChange)="onSelectedTabIndexChange($event)">
    <mat-tab>
      <ng-template mat-tab-label>
        <span class="workspace-tab-label"><mat-icon>event_available</mat-icon>Por evento</span>
      </ng-template>
      <app-workspace-event-attendances-subtab />
    </mat-tab>
    <mat-tab>
      <ng-template mat-tab-label>
        <span class="workspace-tab-label"><mat-icon>festival</mat-icon>Por grande evento</span>
      </ng-template>
      <app-workspace-major-event-attendances-subtab />
    </mat-tab>
  </mat-tab-group>
</section>

<section class="permissions-page">
  <nav mat-tab-nav-bar [tabPanel]="panel" aria-label="Seções de permissões">
    <a mat-tab-link routerLink="mine" routerLinkActive #mine="routerLinkActive" [active]="mine.isActive">
      <span class="workspace-tab-label"><mat-icon>shield_person</mat-icon>Minhas permissões</span>
    </a>
    @if (canManage()) {
      <a mat-tab-link routerLink="manage" routerLinkActive #manage="routerLinkActive" [active]="manage.isActive">
        <span class="workspace-tab-label"><mat-icon>admin_panel_settings</mat-icon>Gerenciamento de permissões</span>
      </a>
    }
  </nav>
  <mat-tab-nav-panel #panel><router-outlet /></mat-tab-nav-panel>
</section>

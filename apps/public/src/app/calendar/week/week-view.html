<section class="week-shell">
  <app-calendar-week-date-selector
    [weekDays]="weekDays()"
    [selectedDate]="selectedDate()"
    [canGoPrevious]="canGoPrevious()"
    (previousWeek)="previousWeek.emit()"
    (nextWeek)="nextWeek.emit()"
    (today)="today.emit()"
    (selectDate)="selectDate.emit($event)" />

  @if (selectedDateEvents().length === 0) {
  <section class="empty-section" aria-live="polite">
    <mat-icon aria-hidden="true">event_busy</mat-icon>
    <p>Nenhum evento nesta data.</p>
  </section>
  } @else {
  <mat-list>
    @for (event of selectedDateEvents(); track event.id) {
    <app-calendar-event-list-item
      [event]="event"
      [isSubscribed]="subscribedEventIds().has(event.id)"
      [returnUrl]="returnUrl()" />
    }
  </mat-list>
  }
</section>

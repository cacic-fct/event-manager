<mat-toolbar class="bottom-toolbar" role="navigation" aria-label="Barra de navegação inferior" #toolbar>
  @for (item of items(); track item.label) {
  <a
    mat-button
    class="nav-btn"
    [class.collapsed]="item.hidden"
    [class.pending]="item.pending"
    [routerLink]="item.route"
    routerLinkActive="active"
    ariaCurrentWhenActive="page"
    [routerLinkActiveOptions]="{ exact: true }"
    [attr.aria-label]="item.label"
    [attr.aria-hidden]="item.hidden"
    [attr.tabindex]="item.hidden ? -1 : null">
    <span class="icon-wrap">
      @if (item.badge === 'notifications') {
      <lib-novu-notification-badge>
        <mat-icon aria-hidden="true">{{ item.icon }}</mat-icon>
      </lib-novu-notification-badge>
      } @else {
      <mat-icon aria-hidden="true">{{ item.icon }}</mat-icon>
      }
    </span>
    <span class="label">{{ item.shortLabel }}</span>
  </a>
  }
</mat-toolbar>
